<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Parking Owners - SmartParking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo"><i class="fa-solid fa-square-parking"></i> SmartParking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="choose-parking.html">Choose Parking</a>
      <a href="booking.html">Booking</a>
      <a href="parking.html" class="active">Parking Owners</a>
      <a href="contact%20us.html">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <button id="theme-toggle" class="btn-theme"><i class="fa-solid fa-moon"></i></button>
      <button class="btn-primary" onclick="openMyBookings()"><i class="fa-solid fa-list-check"></i> My Bookings</button>
    </div>
  </header>

  <main>
    <section class="section highlight-bg">
      <h2>Become a Parking Owner</h2>
      <p>Monetize your unused driveways, garages, or private lots. Earn money by listing your space with us.</p>
      <br>
      <form class="form-container" onsubmit="event.preventDefault(); alert('Space Submitted for Review!');">
        <div class="form-group">
          <label>Owner Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Location / Address</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Number of Available Spots</label>
          <input type="number" min="1" required>
        </div>
        <button type="submit" class="btn-secondary">List Your Space</button>
      </form>
    </section>
  </main>

  <footer><p><center><bold>&copy; 2026 SmartParking. All rights reserved. Designed by Emaan Fatima</bold></center></p></footer>

  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3>📱 Booking Details</h3>
      <div id="modal-details"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
