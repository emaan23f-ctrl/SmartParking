<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Contact Us - SmartParking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo"><i class="fa-solid fa-square-parking"></i> SmartParking</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="choose-parking.html">Choose Parking</a>
      <a href="booking.html">Booking</a>
      <a href="parking.html">Parking Owners</a>
      <a href="contact%20us.html" class="active">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <button id="theme-toggle" class="btn-theme"><i class="fa-solid fa-moon"></i></button>
      <button class="btn-primary" onclick="openMyBookings()"><i class="fa-solid fa-list-check"></i> My Bookings</button>
    </div>
  </header>

  <main>
    <section class="section">
      <h2>Contact Us</h2>
      <p>Have questions? Send us a message or reach out directly.</p>
      
      <form class="form-container" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
        <div class="form-group">
          <label>Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="4" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>

      <br>
      <p><strong>Email:</strong> support@smartparking.com | <strong>Phone:</strong> +92 300 1234567</p>
    </section>
  </main>

  <footer><p><center><bold>&copy; 2026 SmartParking. All rights reserved. Designed by Emaan Fatima</bold></center></p></footer>

  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3>📱 Booking Details</h3>
      <div id="modal-details"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
